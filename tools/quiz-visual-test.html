<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STOXELS - Quiz Modal Visual Test</title>
<!-- Real game stylesheets, same order as index.html -->
<link rel="stylesheet" href="../css/base.css?v=2">
<link rel="stylesheet" href="../css/overlays.css?v=2">
<link rel="stylesheet" href="../css/modals.css?v=2">
<link rel="stylesheet" href="../css/quiz-excercises.css?v=2">
<style>
    /* harness chrome only */
    body { margin: 0; background: #0c0f16; }
    .bar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
        display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
        padding: 6px; background: #14141c; border-bottom: 1px solid #333;
        font-family: monospace; font-size: 11px;
    }
    .bar button {
        background: #2a2440; color: #cfc8ff; border: 1px solid #5a4a8a;
        padding: 4px 10px; cursor: pointer; font-size: 11px; font-family: monospace;
    }
    .bar button.sel { background: #3a3260; }
</style>
</head>
<body>
<div class="bar">
    <button data-view="quiz-fresh" class="sel">Quiz fresh (MC)</button>
    <button data-view="quiz-correct">Quiz answered ✓</button>
    <button data-view="quiz-wrong">Quiz answered ✗</button>
    <button data-view="quiz-input">Quiz input + hint</button>
    <button data-view="mg-fresh">MathGate fresh</button>
    <button data-view="mg-hint">MathGate hint</button>
</div>

<!-- QUIZ OVERLAY (exact markup from index.html) -->
<div class="qr-backdrop" id="quiz-overlay" style="display:flex; position:relative; height:100vh;">
    <div class="qr-panel">
        <button class="qr-close-x" id="quiz-close-x" aria-label="Close" data-t="reset_close">✕</button>
        <!-- Portrait: JS injects an <img> here -->
        <div class="qr-portrait" id="quiz-portrait"></div>

        <div class="qr-content">
            <div class="qr-title" data-t="quiz_title">⭐ BONUS QUESTION ⭐</div>
            <div class="qr-question" id="quiz-q">You flip a fair coin 3 times. What is the probability of getting exactly two heads?</div>
            <div class="qr-opts" id="quiz-opts"></div>
            <div class="qr-input-row" id="quiz-input-row" style="display:none;">
                <div class="qr-input-wrap">
                    <input type="text" id="quiz-input" class="qr-input" autocomplete="off" spellcheck="false" />
                </div>
                <span class="qr-unit" id="quiz-input-unit" style="display:none;">%</span>
                <button class="qr-submit-btn" id="quiz-input-submit" data-t="mg_submit">CHECK</button>
            </div>

            <!-- Feedback cluster (hint / result / explanation / item
                 rewards) anchored above the footer so it never overlaps
                 the answer options or the footer buttons -->
            <div class="qr-feedback-stack">
                <div class="qr-hint" id="quiz-input-hint"></div>
                <div class="qr-result" id="quiz-result"></div>

                <div class="qr-explain" id="quiz-explain" style="display:none;"></div>

                <div class="qr-reward-zone" id="item-reward-zone"></div>
            </div>

            <div class="qr-footer">
                <button class="qr-btn qr-btn--why" id="quiz-why-btn" style="display:none;" data-t="scr_tell_me_why">💡 Tell me why</button>
                <button class="qr-btn qr-btn--tutor" id="quiz-tutor-btn" style="display:none;" data-t="scr_tutor">🎓 TUTOR</button>
                <button class="qr-btn qr-btn--continue" id="quiz-continue" style="display:none;" data-t="quiz_continue">CONTINUE ▶</button>
            </div>
        </div>
    </div>
</div>

<!-- MATH GATE MODAL (exact markup from index.html) -->
<div id="mg-modal" class="modal-bg" style="display:flex; position:relative; height:100vh; z-index:1;">
    <div class="qr-panel">
        <button class="qr-close-x" id="mg-close-x" aria-label="Close" data-t="reset_close">✕</button>
        <!-- Portrait -->
        <div class="qr-portrait" id="mg-portrait"></div>
        <div class="qr-content">
            <div class="qr-title" style="color:#b06cff; text-shadow: 0 0 10px rgba(176,108,255,0.6);" data-t="mg_instruction">Solve this to unlock:</div>
            <div class="qr-question" id="mg-question">A standard deck has 52 cards. You draw two cards without replacement. What is the probability that both are aces? (in %)</div>
            <div class="qr-input-row">
                <div class="qr-input-wrap">
                    <input type="text" id="mg-answer-input" class="qr-input" autocomplete="off" spellcheck="false" placeholder="your answer" />
                </div>
                <span class="qr-unit" id="mg-unit" style="display:none;">%</span>
                <button class="qr-submit-btn" id="mg-submit-btn" data-t="mg_submit">CHECK</button>
            </div>

            <!-- Feedback cluster (hint / result / explanation) anchored
                 above the footer so it never overlaps the input row or
                 the footer buttons -->
            <div class="qr-feedback-stack">
                <div class="qr-hint" id="mg-hint-box">
                    <div class="qr-hint-text" id="mg-hint-text"></div>
                </div>

                <div class="qr-result mg-feedback" id="mg-feedback"></div>

                <div class="qr-explain" id="mg-explain" style="display:none;"></div>
            </div>

            <div class="qr-footer">
                <button class="qr-btn qr-btn--why" id="mg-why-btn" style="display:none;" data-t="scr_tell_me_why">💡 Tell me why</button>
                <button class="qr-btn qr-btn--tutor" id="mg-tutor-btn" style="display:none;" data-t="scr_tutor">🎓 TUTOR</button>
                <button class="qr-btn qr-btn--newq" id="mg-new-q-btn" style="display:none;" data-t="mg_new_q">🔄 NEW Q</button>
                <button class="qr-btn qr-btn--continue" id="mg-continue-btn" style="display:none;" data-t="quiz_continue">CONTINUE ▶</button>
            </div>
        </div>
    </div>
</div>

<script>
// ---------- shared helpers replicating quiz.js behaviour ----------
const optsEl = document.getElementById('quiz-opts');
const MC = ['1/8', '1/4', '3/8', '1/2'];

function renderMc() {
    optsEl.innerHTML = '';
    MC.forEach(text => {
        const btn = document.createElement('button');
        btn.className = 'quiz-opt'; // quiz.js uses the overlays.css class for MC buttons
        btn.textContent = text;
        optsEl.appendChild(btn);
    });
}

function showView(name) {
    const quiz = document.getElementById('quiz-overlay');
    const mg = document.getElementById('mg-modal');
    quiz.style.display = 'none';
    mg.style.display = 'none';

    renderMc();
    // reset quiz bits
    document.getElementById('quiz-result').textContent = '';
    document.getElementById('quiz-result').className = 'quiz-result';
    document.getElementById('quiz-explain').style.display = 'none';
    document.getElementById('quiz-input-hint').textContent = '';
    document.getElementById('quiz-input-hint').style.display = 'none';
    document.getElementById('quiz-continue').style.display = 'none';
    document.getElementById('quiz-why-btn').style.display = 'none';
    document.getElementById('quiz-tutor-btn').style.display = 'none';
    document.getElementById('quiz-input-row').style.display = 'none';

    // reset mg bits
    document.getElementById('mg-feedback').textContent = '';
    document.getElementById('mg-feedback').className = 'mg-feedback';
    document.getElementById('mg-hint-box').style.display = 'none';
    document.getElementById('mg-hint-text').textContent = '';
    document.getElementById('mg-new-q-btn').style.display = 'none';
    document.getElementById('mg-continue-btn').style.display = 'none';
    document.getElementById('mg-why-btn').style.display = 'none';
    document.getElementById('mg-explain').style.display = 'none';
    document.getElementById('mg-tutor-btn').style.display = 'none';

    if (name.startsWith('quiz-')) quiz.style.display = 'flex';
    else mg.style.display = 'flex';

    if (name === 'quiz-fresh') {
        document.getElementById('quiz-tutor-btn').style.display = 'inline-block';
    }
    if (name === 'quiz-correct') {
        const btns = Array.from(optsEl.children);
        btns[2].classList.add('correct');
        btns.forEach(b => b.style.cursor = 'default');
        const res = document.getElementById('quiz-result');
        res.className = 'quiz-result ok';
        res.textContent = '✓ CORRECT! +50 Score & Item reward!';
        document.getElementById('quiz-continue').style.display = 'flex';
        document.getElementById('quiz-why-btn').style.display = 'inline-block';
        const ex = document.getElementById('quiz-explain');
        ex.textContent = '💡 Each flip has probability 1/2. The number of heads follows Binomial(3, 1/2), so P(exactly 2 heads) = C(3,2) · (1/2)² · (1/2) = 3/8.';
        ex.style.display = 'block';
    }
    if (name === 'quiz-wrong') {
        const btns = Array.from(optsEl.children);
        btns[0].classList.add('wrong');
        btns[2].classList.add('correct');
        btns.forEach(b => b.style.cursor = 'default');
        const res = document.getElementById('quiz-result');
        res.className = 'quiz-result bad';
        res.textContent = '✗ Wrong answer. No bonus.';
        document.getElementById('quiz-continue').style.display = 'flex';
        document.getElementById('quiz-why-btn').style.display = 'inline-block';
    }
    if (name === 'quiz-input') {
        document.getElementById('quiz-input-row').style.display = 'flex';
        document.getElementById('quiz-opts').innerHTML = '';
        const hint = document.getElementById('quiz-input-hint');
        hint.textContent = '💡 Remember: with replacement, each draw is independent. Multiply the two probabilities.';
        hint.style.display = 'block';
        const res = document.getElementById('quiz-result');
        res.className = 'quiz-result bad';
        res.textContent = '✗ Wrong answer. No bonus.';
        document.getElementById('quiz-continue').style.display = 'flex';
        document.getElementById('quiz-why-btn').style.display = 'inline-block';
    }
    if (name === 'mg-fresh') {
        document.getElementById('mg-tutor-btn').style.display = 'inline-block';
    }
    if (name === 'mg-hint') {
        const res = document.getElementById('mg-feedback');
        res.className = 'mg-feedback mg-bad';
        res.textContent = '✗ Not quite. Attempt 5 — try again!';
        const box = document.getElementById('mg-hint-box');
        document.getElementById('mg-hint-text').textContent = '💡 P(both aces) = (4/52) · (3/51) = 1/221 ≈ 0.45%.';
        box.style.display = 'block';
        document.getElementById('mg-new-q-btn').style.display = 'inline-block';
        document.getElementById('mg-why-btn').style.display = 'inline-block';
    }

    document.querySelectorAll('.bar button').forEach(b =>
        b.classList.toggle('sel', b.dataset.view === name));
}

document.querySelectorAll('.bar button').forEach(b =>
    b.addEventListener('click', () => showView(b.dataset.view)));

showView('quiz-fresh');
</script>
</body>
</html>
