# Full local gate, runnable on GitHub: npm run lint + npm test +
# npm run phase2:verify + npm run build (see README.md).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: lint + tests + phase2:verify + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tooling dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # generated/phase2/entry.mjs must match tools/module-manifest.json
      # (this also validates the manifest: every listed export must exist,
      # every globalThis.X read must be bridged).
      - name: phase2:verify
        run: npm run phase2:verify

      - name: Build
        run: npm run build
